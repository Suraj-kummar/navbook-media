[project]
name = "navbook-backend"
version = "0.1.0"
description = "Navbook FastAPI Backend for secure media vault"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
    "pydantic==2.5.0",
    "bcrypt==4.1.1",
    "pyjwt==2.8.1",
    "boto3==1.29.7",
    "python-multipart==0.0.6",
    "cors==1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
